  <div class="receipt">

    <hr>

    <ul id="orderList"></ul>

    <!-- Summary -->
    <p>ITEM COUNT: <span id="itemCount"></span></p>
    <p>Subtotal: <span id="subtotal"></span></p>

    <p>CARD: **** **** **** 4321</p>
